name: render
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "all 또는 쉼표로 구분한 에피소드 (ep01_cats,...)"
        default: "all"
      mode:
        description: "preview 또는 full"
        default: "preview"
      chunks:
        description: "full 모드에서 에피소드당 병렬 조각 수"
        default: "6"
      step:
        description: "preview 프레임 간격"
        default: "60"
      only:
        description: "이 조각만 렌더 (ep04_ice:3,ep06_onenation:2), 비우면 전부"
        default: ""
      reuse_run:
        description: "나머지 조각을 가져올 이전 실행 번호"
        default: ""

env:
  BLENDER_VERSION: "4.2.23"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      eps: ${{ steps.p.outputs.eps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: bl
        with:
          path: ~/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}
      - if: steps.bl.outputs.cache-hit != 'true'
        run: curl -sSL -o ~/blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
      - run: pip install -q numpy
      - id: p
        run: python -m engine.run plan --gh --episodes "${{ inputs.episodes }}" --chunks ${{ inputs.chunks }} --mode ${{ inputs.mode }} --step ${{ inputs.step }} --only "${{ inputs.only }}" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: bl
        with:
          path: ~/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}
      - if: steps.bl.outputs.cache-hit != 'true'
        run: curl -sSL -o ~/blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
      - name: deps
        timeout-minutes: 20
        run: |
          mkdir -p ~/blender && tar -xJf ~/blender.tar.xz -C ~/blender --strip-components=1
          # 러너에 이미 있으면 apt를 건너뜀 (apt-get update가 가끔 12분 넘게 멈춤)
          if ldd ~/blender/blender | grep -q "not found" || ! command -v ffmpeg > /dev/null; then
            for i in 1 2 3 4; do timeout 150 sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libegl1 ffmpeg > /dev/null && break || timeout 150 sudo apt-get update -qq || sleep 10; done
          fi
          for i in 1 2 3; do timeout 240 pip install -q numpy pillow opencv-python-headless OpenEXR && break || sleep 15; done
          # apt가 실패해 ffmpeg가 없으면 pip 정적 빌드로 대신 (렌더 30분 뒤 post에서 죽지 않게)
          if ! command -v ffmpeg > /dev/null; then
            pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
          nproc; free -g | head -2
      - name: sim
        run: python -m engine.run sim ${{ matrix.ep }}
      - name: render
        run: |
          ~/blender/blender -b --factory-startup --python-exit-code 1 -P engine/blender_main.py -- \
            --ep ${{ matrix.ep }} --frames "${{ matrix.frames }}" --out build/${{ matrix.ep }}/frames \
            --pct ${{ matrix.pct }} --samples ${{ matrix.samples }} --bounces ${{ matrix.bounces }} --device CPU 2>&1 | grep -E "^\[|Error|Traceback|line [0-9]+" || true
          test -f build/${{ matrix.ep }}/frames/anchors.json
      - name: post (full)
        if: inputs.mode == 'full'
        run: python -m engine.run post ${{ matrix.ep }} --frames "${{ matrix.frames }}" --out out/${{ matrix.ep }}_${{ matrix.part }}.mp4
      - name: post (preview)
        if: inputs.mode == 'preview'
        run: python -m engine.run preview ${{ matrix.ep }} --frames "${{ matrix.frames }}" --out out/preview_${{ matrix.ep }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode }}-${{ matrix.ep }}-${{ matrix.part }}
          path: out/
          retention-days: 5

  assemble:
    needs: [plan, render]
    if: ${{ !cancelled() && inputs.mode == 'full' }}   # 다른 편 조각이 실패해도 완성된 편은 합침
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ep: ${{ fromJson(needs.plan.outputs.eps) }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        timeout-minutes: 20
        run: |
          for i in 1 2 3 4; do timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg fluidsynth fluid-soundfont-gm > /dev/null && break || timeout 150 sudo apt-get update -qq || sleep 10; done
          pip install -q numpy
      - if: inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: full-${{ matrix.ep }}-*
          path: chunks
          merge-multiple: true
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-${{ matrix.ep }}-*
          path: chunks
          merge-multiple: true
      - run: python -m engine.run music ${{ matrix.ep }}
      - run: |
          mkdir -p final
          python -m engine.run assemble ${{ matrix.ep }} --chunks $(ls chunks/*.mp4 | sort -V) --out final/${{ matrix.ep }}.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 final/${{ matrix.ep }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ matrix.ep }}
          path: final/
          retention-days: 14
